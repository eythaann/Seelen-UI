name: "Publish Core Library"

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      next:
        description: "Publish as next pre-release (uses date-based version with tag next)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./libs/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Setup Rust
        run: rustup --version

      - name: Install dependencies
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Set next version
        if: ${{ inputs.next }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'libs/core/package.json';

            const packageJson = JSON.parse(fs.readFileSync(path, 'utf8'));
            const currentVersion = packageJson.version;

            const timestamp = new Date().toISOString().replace(/[-:T]/g, '').slice(2, 12);
            const nextVersion = `${currentVersion}-next.${timestamp}`;

            packageJson.version = nextVersion;
            fs.writeFileSync(path, JSON.stringify(packageJson, null, 2) + '\n');

            core.info(`Version set to ${nextVersion}`);

      - name: Build Rust Bindings (ts-rs)
        run: npm run build:rs

      - name: Type check
        run: npm run type-check

      - name: Build NPM package
        run: npm run build:js

      - name: Publish to NPM
        run: npm --verbose publish --tag ${{ inputs.next && 'next' || 'latest' }}
