auth:
  login_failed_body: >-
    Đã xảy ra lỗi trong quá trình đăng nhập. Nếu lỗi này vẫn tiếp diễn, hãy đảm
    bảo dịch vụ 'Credential Manager' của Windows (VaultSvc) đang được bật và
    hoạt động, sau đó thử lại.
  login_failed_title: Đăng nhập thất bại
cancel: Hủy
done: Hoàn tất
elevated:
  description: |-
    Seelen UI hiện đang chạy dưới quyền Quản trị viên (Administrator).
    Điều này không giúp tăng thêm tính năng nào mà có thể tiềm ẩn rủi ro bảo mật.
    Để đảm bảo an toàn, vui lòng khởi động lại ứng dụng với quyền người dùng thông thường.
  title: Đang chạy dưới quyền Quản trị viên
file_explorer: Trình quản lý tệp (File Explorer)
resource:
  added: Đã thêm một tài nguyên mới
  download_failed_body: >-
    Đã xảy ra lỗi trong quá trình tải tài nguyên, vui lòng báo lại cho đội ngũ
    phát triển Seelen UI.
  download_failed_title: Tải tài nguyên thất bại
  downloading: Đang tải gói dữ liệu...
  downloading_body: Quá trình này có thể mất vài giây, vui lòng không đóng cửa sổ.
  enable: Bật
  login_required_action: Đăng nhập
  login_required_body: Bạn cần đăng nhập để tải tài nguyên này.
  login_required_title: Yêu cầu đăng nhập
runtime:
  corrupted_data: Dữ liệu bị lỗi
  corrupted_file: Tệp cấu hình bị lỗi, hệ thống sẽ sử dụng các giá trị mặc định thay thế.
  corrupted_file_path: Đường dẫn tệp bị lỗi
  download: Đi tới trang tải xuống
  files_integrity: >-
    Không thể xác minh tính toàn vẹn của các tệp ứng dụng.

    Điều này có thể xảy ra khi tệp bị chỉnh sửa, hư hỏng hoặc quá trình cài đặt
    bị gián đoạn.

    Vì lý do an toàn, Seelen UI không thể tiếp tục hoạt động.

    Vui lòng cài đặt lại ứng dụng từ trang chủ chính thức.
  files_integrity_title: Cảnh báo bảo mật - Kiểm tra toàn vẹn tệp thất bại
  not_found: Không tìm thấy WebView2 Runtime
  not_found_description: Seelen UI yêu cầu Microsoft WebView2 Runtime để hoạt động. Vui lòng cài đặt bổ sung.
  outdated: WebView2 Runtime đã lỗi thời
  outdated_description: >-
    Seelen UI yêu cầu WebView2 Runtime phiên bản %{min_version} trở lên. Vui lòng
    cập nhật phiên bản mới hơn.
service:
  not_running: Dịch vụ Seelen UI Service chưa chạy
  not_running_description: >-
    Dịch vụ nền Seelen UI (slu-service) là thành phần phụ trợ bắt buộc để ứng
    dụng hoạt động ổn định và an toàn.
  not_running_ok: Khởi động dịch vụ
shortcut:
  conflicts:
    body: Một số phím tắt đang bị trùng lặp với nhiều hành động, vui lòng thiết lập lại.
    dismiss: Bỏ qua
    review: Xem lại
    title: Phát hiện xung đột phím tắt
  register:
    placeholder: Nhấn tổ hợp phím bất kỳ
    title: Đăng ký phím tắt mới
widget_liveness:
  failed_description: |-
    Tiện ích '%{widget_name}' đã ngừng phản hồi nhiều lần.

    Bạn có thể thử khởi động lại ứng dụng.
  failed_title: Lỗi tiện ích
widget_permissions:
  perm_kill_processes: buộc đóng các ứng dụng khác
  perm_manage_app_windows: điều khiển cửa sổ của các ứng dụng khác (focus, đóng, thu nhỏ, di chuyển)
  perm_modify_configuration: chỉnh sửa cấu hình Seelen UI
  perm_open_file: mở tệp tin
  perm_run: khởi chạy chương trình
  request_description: |-
    Tiện ích '%{widget_name}' đang yêu cầu quyền: %{command}.

    Bạn có muốn cấp quyền này không?
  request_title: Yêu cầu cấp quyền tiện ích
