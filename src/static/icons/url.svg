    <line x1="52" y1="88" x2="140" y2="88" />
    <path d="M60 66 H132 M60 110 H132" />
  </g>

  <!-- URL tag sticking out of the right edge of the page -->
  <rect x="98" y="148" width="146" height="76" rx="14" fill="#0a3a5c" opacity="0.25" />
  <rect x="96" y="140" width="146" height="76" rx="14" fill="url(#tag)" />
  <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- U -->
    <path d="M114 160 V182 a14 14 0 0 0 28 0 V160" />
    <!-- R -->
