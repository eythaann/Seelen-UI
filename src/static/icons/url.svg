<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7" />
      <stop offset="1" stop-color="#e3e6ea" />
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1667a0" />
      <stop offset="1" stop-color="#0c4a75" />
    </linearGradient>
  </defs>

  <!-- file page with folded top-right corner -->
  <path d="M48 12 H152 L204 64 V232 a12 12 0 0 1 -12 12 H48 a12 12 0 0 1 -12 -12 V24 a12 12 0 0 1 12 -12 Z"
