  <path d="M152 12 V54 a10 10 0 0 0 10 10 H204 Z" fill="#c9ced6" />

  <!-- globe -->
  <g fill="none" stroke="#0ea5d0" stroke-width="7.5" stroke-linecap="round">
    <circle cx="96" cy="88" r="44" />
