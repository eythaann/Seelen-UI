id: "@seelen/tb-network-popup"
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
icon: FaWifi
target: "@seelen/fancy-toolbar"
plugin:
  scopes:
    - Network
  tooltip: >-
    return online ? t("placeholder.ethernet_connected") : t("placeholder.ethernet_disconnected")
  template: >-
    if (!online) return Icon({ name: "TbWorldCancel" });
    if (usingInterface?.type === "IEEE80211") return Icon({ name: "FaWifi" });
    return Icon({ name: "FaComputer" });
  onClickV2: |-
    trigger("@seelen/network-popup");
