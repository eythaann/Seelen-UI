id: "@seelen/media-popup"
icon: IoVolumeHighOutline
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
instances: Single
loader: Internal
preset: Popup
hidden: true
lazy: true
settings:
  - type: switch
    key: rememberLastView
    label: !extend i18n/settings/remember-last-view.yml
    description: !extend i18n/settings/remember-last-view-description.yml
    defaultValue: false
plugins:
  - !extend ./toolbar-plugin.yml
  - !extend ./dock-plugin.yml
